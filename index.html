<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Benim Mağazam</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#faf8f5;--card:#fff;--tx:#1d1b19;--mu:#6b665f;--ac:#d9480f;--bd:#e7e2da}
@media (prefers-color-scheme:dark){:root{--bg:#171513;--card:#211f1c;--tx:#f2eee8;--mu:#a39d94;--ac:#ff8a4c;--bd:#35312c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bd)}
h1{font-size:20px;margin:0}
button{font:inherit;cursor:pointer}
.cartbtn{background:var(--ac);color:#fff;border:0;border-radius:999px;padding:8px 14px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:16px;max-width:960px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--bd)}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.info span{color:var(--mu);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info small{color:var(--mu);font-weight:400}
#msg{text-align:center;color:var(--mu);padding:40px 16px}
#detail{display:none;max-width:960px;margin:auto;padding:0 16px 40px}
.back{background:none;border:0;color:var(--tx);padding:12px 0;font-size:15px}
.dwrap{display:grid;grid-template-columns:1fr;gap:20px}
@media (min-width:720px){.dwrap{grid-template-columns:1fr 1fr}}
.main{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:var(--bd)}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin-top:8px;padding:2px}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer;flex:none}
.thumbs img.on{border-color:var(--ac)}
.price{font-size:26px;font-weight:700;margin:6px 0 16px}
.opt{margin-bottom:16px}
.opt b{display:block;margin-bottom:8px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:44px;padding:8px 12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font-size:14px}
.chip.on{border-color:var(--ac);outline:2px solid var(--ac)}
.chip.off{opacity:.35;text-decoration:line-through}
.sw{width:36px;height:36px;border-radius:50%;padding:0;min-width:0;border:1px solid var(--mu)}
.sw.off{text-decoration:none}
.desc{white-space:pre-wrap;color:var(--mu);font-size:14px;line-height:1.55;margin-top:20px}
.big{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:14px;font-weight:700;width:100%;font-size:16px}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(360px,100%);background:var(--card);border-left:1px solid var(--bd);transform:translateX(100%);transition:transform .25s;z-index:10;display:flex;flex-direction:column;padding:16px}
#drawer.open{transform:none}
#items{flex:1;overflow:auto}
.row{display:flex;justify-content:space-between;align-items:center}
.it{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);gap:8px;font-size:14px}
.q button{width:26px;height:26px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:6px}
.pay{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px;font-weight:600;width:100%;margin-top:10px}
.x{background:none;border:0;color:var(--tx);font-size:24px;align-self:flex-end}
</style>
</head>
<body>
<header><h1 id="shop"></h1><button class="cartbtn" id="open">Sepet (<span id="n">0</span>)</button></header>
<div id="msg">Ürünler yükleniyor…</div>
<div class="grid" id="grid"></div>
<div id="detail"></div>
<aside id="drawer">
<button class="x" id="close">×</button>
<h3 style="margin:0 0 8px">Sepetin</h3>
<div id="items"></div>
<div class="row"><b>Toplam</b><b id="tot"></b></div>
<button class="pay" id="pay">Ödemeye geç</button>
</aside>
<script>
window.onerror=function(m,s,l){var e=document.getElementById("msg");if(e){e.style.display="block";e.style.color="red";e.textContent="Hata: "+m+" (satır "+l+")";}};
</script>
<script>
var SHOP_NAME="Benim Mağazam";
var CURRENCY="$";
var CHECKOUT_URL="";
var P=[],cart={},cur=null,sel={},mainIdx=0;
try{cart=JSON.parse(localStorage.getItem("cart")||"{}");}catch(e){}
function $(i){return document.getElementById(i);}
function fmt(v){return CURRENCY+Number(v).toFixed(2);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function save(){try{localStorage.setItem("cart",JSON.stringify(cart));}catch(e){}}
$("shop").textContent=SHOP_NAME;
document.title=SHOP_NAME;

function minMax(p){
  var a=p.variants[0].price,b=a;
  for(var i=0;i<p.variants.length;i++){var x=p.variants[i].price;if(x<a){a=x;}if(x>b){b=x;}}
  return [a,b];
}
function card(p){
  var m=minMax(p);
  return '<div class="card" data-id="'+esc(p.id)+'"><img src="'+esc(p.image)+'" alt="'+esc(p.title)+'">'
    +'<div class="info"><b>'+esc(p.title)+'</b><span>'+esc(p.desc)+'</span>'
    +'<b>'+fmt(m[0])+(m[1]>m[0]?' <small>ve üzeri</small>':'')+'</b></div></div>';
}

function selVariant(p){
  for(var i=0;i<p.variants.length;i++){
    var v=p.variants[i],ok=true;
    for(var k in sel){if(v.o.indexOf(sel[k])<0){ok=false;break;}}
    if(ok){return v;}
  }
  return null;
}
function avail(p,oi,id){
  for(var i=0;i<p.variants.length;i++){
    var v=p.variants[i];
    if(v.o.indexOf(id)<0){continue;}
    var ok=true;
    for(var k in sel){if(k!=oi&&v.o.indexOf(sel[k])<0){ok=false;break;}}
    if(ok){return true;}
  }
  return false;
}
function setFromVariant(p,v){
  for(var j=0;j<p.options.length;j++){
    for(var m=0;m<p.options[j].values.length;m++){
      if(v.o.indexOf(p.options[j].values[m].id)>=0){sel[j]=p.options[j].values[m].id;}
    }
  }
}
function pick(p,oi,id){
  sel[oi]=id;
  if(selVariant(p)){return;}
  var best=null,bs=-1;
  for(var i=0;i<p.variants.length;i++){
    var v=p.variants[i];
    if(v.o.indexOf(id)<0){continue;}
    var s=0;
    for(var k in sel){if(k!=oi&&v.o.indexOf(sel[k])>=0){s++;}}
    if(s>bs){bs=s;best=v;}
  }
  if(best){setFromVariant(p,best);}
}
function initSel(p){
  sel={};
  var v=p.variants[0];
  for(var i=0;i<p.variants.length;i++){if(p.variants[i].id===p.d){v=p.variants[i];}}
  setFromVariant(p,v);
}
function imgsFor(p,v){
  var a=[];
  for(var i=0;i<p.images.length;i++){
    if(!v||p.images[i].v.indexOf(v.id)>=0){a.push(p.images[i].src);}
  }
  if(!a.length){for(var j=0;j<p.images.length;j++){a.push(p.images[j].src);}}
  if(!a.length){a.push(p.image);}
  return a;
}

function renderDetail(){
  var p=cur,v=selVariant(p)||p.variants[0];
  var im=imgsFor(p,v);
  if(mainIdx>=im.length){mainIdx=0;}
  var h='<button class="back" id="back">← Geri</button><div class="dwrap"><div>'
    +'<img class="main" src="'+esc(im[mainIdx])+'" alt="">'
    +'<div class="thumbs">';
  for(var t=0;t<im.length;t++){
    h+='<img data-t="'+t+'" class="'+(t===mainIdx?'on':'')+'" src="'+esc(im[t])+'" alt="">';
  }
  h+='</div></div><div><h2 style="margin:0">'+esc(p.title)+'</h2>'
    +'<div class="price">'+fmt(v.price)+'</div>';
  for(var oi=0;oi<p.options.length;oi++){
    var o=p.options[oi],chosen="",chips="";
    for(var j=0;j<o.values.length;j++){
      var val=o.values[j],on=(sel[oi]===val.id);
      if(on){chosen=val.title;}
      var cls=(val.color?'chip sw':'chip')+(on?' on':'')+(avail(p,oi,val.id)?'':' off');
      var st=val.color?' style="background:'+esc(val.color)+'"':'';
      chips+='<button class="'+cls+'"'+st+' title="'+esc(val.title)+'" data-o="'+oi+'" data-val="'+val.id+'">'+(val.color?'':esc(val.title))+'</button>';
    }
    h+='<div class="opt"><b>'+esc(o.name)+': '+esc(chosen)+'</b><div class="chips">'+chips+'</div></div>';
  }
  h+='<button class="big" id="addbtn">Sepete ekle</button>'
    +(p.desc?'<div class="desc">'+esc(p.desc)+'</div>':'')
    +'</div></div>';
  $("detail").innerHTML=h;
}

function route(){
  var h=location.hash.replace("#","");
  if(h.indexOf("u-")===0){
    var id=h.slice(2),f=null;
    for(var i=0;i<P.length;i++){if(P[i].id===id){f=P[i];}}
    if(f){
      if(cur!==f){cur=f;initSel(f);mainIdx=0;}
      renderDetail();
      $("detail").style.display="block";
      $("grid").style.display="none";
      window.scrollTo(0,0);
      return;
    }
  }
  cur=null;
  $("detail").style.display="none";
  $("grid").style.display="grid";
}
window.addEventListener("hashchange",route);

fetch("/api/products").then(function(r){return r.json();}).then(function(d){
  if(!d.length){$("msg").textContent="Henüz ürün yok.";return;}
  P=d;
  $("msg").style.display="none";
  $("grid").innerHTML=P.map(card).join("");
  route();
}).catch(function(e){$("msg").textContent="Ürünler yüklenemedi: "+e;});

function addCur(){
  var p=cur,v=selVariant(p)||p.variants[0];
  var k=p.id+"|"+v.id;
  if(!cart[k]){cart[k]={title:p.title,vt:v.title,price:v.price,q:0};}
  cart[k].q++;
  save();draw();$("drawer").className="open";
}
function chg(k,d){
  cart[k].q+=d;
  if(cart[k].q<=0){delete cart[k];}
  save();draw();
}
function draw(){
  var t=0,c=0,h="";
  for(var k in cart){
    var x=cart[k];
    t+=x.price*x.q;c+=x.q;
    h+='<div class="it"><span>'+esc(x.title)+'<br><small>'+esc(x.vt)+'</small></span>'
      +'<span class="q"><button data-k="'+esc(k)+'" data-d="-1">-</button> '+x.q
      +' <button data-k="'+esc(k)+'" data-d="1">+</button></span><b>'+fmt(x.price*x.q)+'</b></div>';
  }
  $("items").innerHTML=h||'<p style="color:var(--mu)">Sepetin boş.</p>';
  $("tot").textContent=fmt(t);
  $("n").textContent=c;
}
document.addEventListener("click",function(e){
  var t=e.target;
  var c=t.closest?t.closest(".card"):null;
  if(c){location.hash="u-"+c.getAttribute("data-id");return;}
  if(t.id==="back"){
    if(history.length>1){history.back();}else{location.hash="";}
    return;
  }
  if(t.id==="addbtn"){addCur();return;}
  if(t.getAttribute("data-val")!==null){
    pick(cur,Number(t.getAttribute("data-o")),Number(t.getAttribute("data-val")));
    mainIdx=0;renderDetail();return;
  }
  if(t.getAttribute("data-t")!==null){
    mainIdx=Number(t.getAttribute("data-t"));renderDetail();return;
  }
  if(t.getAttribute("data-k")!==null){
    chg(t.getAttribute("data-k"),Number(t.getAttribute("data-d")));
  }
});
$("open").onclick=function(){$("drawer").className="open";};
$("close").onclick=function(){$("drawer").className="";};
$("pay").onclick=function(){
  if(!Object.keys(cart).length){return;}
  if(CHECKOUT_URL){location.href=CHECKOUT_URL;}
  else{alert("CHECKOUT_URL alanına ödeme linkini ekle.");}
};
draw();
</script>
</body>
</html>
